services:
  xboard:
    image: xboard:latest
    build:
      context: .
      args:
        - VERSION=${VERSION:-dev}
        - COMMIT=${COMMIT:-unknown}
        - BUILD_TIME=${BUILD_TIME:-unknown}
    container_name: xboard
    restart: unless-stopped
    volumes:
      # SQLite database persistence
      - xboard-data:/data
      # Configuration file (create config.yml first)
      - ./config.yml:/etc/xboard/config.yml:ro
    environment:
      - XBOARD_DB_PATH=/data/xboard.db
      - XBOARD_HTTP_ADDR=:8080
      - TZ=Asia/Shanghai
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  xboard-data:
    driver: local
